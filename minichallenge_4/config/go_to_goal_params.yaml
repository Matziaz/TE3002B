# Go-to-Goal Navigation Node Parameters
# Point-to-point navigation controller with traffic light integration

go_to_goal_node:
  ros__parameters:
    # Route waypoints. Each x value pairs with the y value at the same index.
    goal_x_list: [0.0, 0.0, 0.6, 0.6, 1.0]
    goal_y_list: [0.0, 0.5, 0.5, 1.0, 0.5]

    # Controller timing and gains.
    control_loop_rate: 0.05
    kv: 0.4
    kw: 0.4
    v_max: 0.3
    w_max: 0.3

    # Goal and heading tolerances.
    dist_threshold: 0.08
    angle_trigger: 0.3

    # ROS topics used to communicate with the other nodes.
    pose_topic: 'pose'
    cmd_vel_topic: 'cmd_vel'
    velocity_scale_topic: 'velocity_scale'
