# Traffic Light Controller Parameters
# Red is latched until a valid green detection is observed.

traffic_light_controller:
  ros__parameters:
    # If no valid color is detected for this many seconds, the signal is considered lost.
    signal_loss_timeout: 2.0

    # Speed multiplier used when yellow is detected.
    slow_velocity_factor: 0.18

    # Minimum confidence required before trusting a color decision.
    confidence_threshold: 0.25

    # Number of repeated updates needed before changing states.
    transition_frames: 1
    enable_logging: true
