line_follower_node:
  ros__parameters:
    image_topic: '/camera'
    velocity_scale_topic: 'velocity_scale'
    cmd_vel_topic: 'cmd_vel'

    line_color: 'black'

    h_lower: 0
    h_upper: 180
    s_lower: 0
    s_upper: 255
    v_lower: 0
    v_upper: 90

    roi_start_fraction: 0.72
    roi_end_fraction: 0.92

    min_line_area: 300.0
    morphology_kernel_size: 5

    # PD
    kp: 0.75
    kd: 0.22

    # Velocidad adaptativa
    v_base: 0.35
    v_min: 0.20
    v_max: 0.48
    slow_down_error: 0.45

    # Inercia
    max_accel_step: 0.015
    max_decel_step: 0.040

    # Giro máximo
    w_max: 1.25

    # Si gira al lado contrario, cambia a 1.0
    steering_sign: -1.0

    stop_when_line_lost: true

    control_loop_rate: 0.033
    enable_line_follower: true