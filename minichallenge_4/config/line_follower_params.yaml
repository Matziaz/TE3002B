line_follower_node:
  ros__parameters:
    image_topic: '/camera'
    velocity_scale_topic: 'velocity_scale'
    cmd_vel_topic: 'cmd_vel'

    # Tu línea es negra
    line_color: 'black'

    # HSV para línea negra
    h_lower: 0
    h_upper: 180
    s_lower: 0
    s_upper: 255
    v_lower: 0
    v_upper: 90

    # Franja inferior para seguir el centro real de la línea
    roi_start_fraction: 0.72
    roi_end_fraction: 0.92

    min_line_area: 300.0
    morphology_kernel_size: 5

    # PD se conserva
    kp: 0.5
    kd: 0.1

    v_base: 0.2
    w_max: 0.5

    # Si gira al lado contrario, cambia esto a 1.0
    steering_sign: -1.0

    stop_when_line_lost: true

    control_loop_rate: 0.033
    enable_line_follower: true