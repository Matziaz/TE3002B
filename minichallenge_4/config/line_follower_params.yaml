line_follower_node:
  ros__parameters:
    # Tópicos
    image_topic: '/camera'
    velocity_scale_topic: 'velocity_scale'
    cmd_vel_topic: 'cmd_vel'
    
    # Detección de Blanco (ajustado para ignorar reflejos)
    line_color: 'white'
    h_lower: 0
    h_upper: 180
    s_lower: 0
    s_upper: 40       # Menos saturación = blanco más puro
    v_lower: 210      # Solo buscar cosas muy brillantes
    v_upper: 255
    
    # Región de interés (ROI)
    # Mirar un poco más arriba (0.6) ayuda a ver la curva antes de llegar
    roi_start_fraction: 0.6
    roi_end_fraction: 0.9
    
    # Ganancias PD
    # Kp más alta ayuda a reaccionar rápido en curvas cerradas
    kp: 1.1
    kd: 0.25
    
    # Velocidades
    v_base: 0.40      # Velocidad base más conservadora para no salirse
    w_max: 1.5        # ¡IMPORTANTE! Aumentado para que pueda girar en U si es necesario
    
    control_loop_rate: 0.033
    enable_line_follower: true