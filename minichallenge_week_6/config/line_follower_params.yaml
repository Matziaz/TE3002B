# Line Follower Node Parameters
# Gradient-based line detection with PI adaptive control
# Alternative implementation: detects by edge gradients (not HSV color)

line_follower_node:
  ros__parameters:
    # ===== ROS Topic Configuration =====
    image_topic: '/camera'           # Camera feed topic
    velocity_scale_topic: 'velocity_scale'  # Traffic light velocity scale
    cmd_vel_topic: 'cmd_vel'         # Motor command topic
    
    # ===== Vision Parameters (Gradient-based Detection) =====
    # ROI: region from roi_start_fraction to roi_end_fraction of image height
    roi_start_fraction: 0.4          # Start analyzing at 40% of image height
    roi_end_fraction: 1.0            # End at 100% (bottom edge)
    
    # Detection: sample this many rows across ROI and vote for line position
    detection_rows: 6                # Higher = more robust but slower
    
    # Edge detection threshold
    # Pixels with |Sobel_X| gradient above this are considered line edges
    edge_threshold: 40               # Adjust based on camera/lighting
    
    # Blur kernel for noise reduction (automatically made odd if even)
    blur_kernel: 5                   # Typical: 3, 5, 7
    
    # ===== Control Parameters (PI Adaptive) =====
    # PI gains for angular velocity control
    kp: 0.7                          # Proportional gain - higher = more aggressive steering
    ki: 0.06                         # Integral gain - eliminates offset
    
    # Velocity parameters
    v_base: 0.25                     # Base linear velocity (m/s)
    w_max: 0.7                       # Maximum angular velocity (rad/s)
    
    # Confidence-based speed adjustment
    # When line is not clearly detected, reduce speed automatically
    confidence_threshold: 0.25       # Min confidence (0-1) to move at full speed
    confidence_scaling: true         # Enable/disable automatic speed reduction
    
    # Control loop timing
    control_loop_rate: 0.033         # Timer period in seconds (~30 Hz)
    
    # Enable/disable line follower
    enable_line_follower: true       # Set to false for manual testing
