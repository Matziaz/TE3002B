# Line Follower Node Parameters
# PID-based line following with traffic light integration

line_follower_node:
  ros__parameters:
    # ROS topic configuration
    image_topic: '/camera'
    velocity_scale_topic: 'velocity_scale'
    cmd_vel_topic: 'cmd_vel'
    
    # Line detection: HSV color range
    # For BLACK line:
    #   H: 0-180 (any hue works for black)
    #   S: 0-255 (any saturation, irrelevant for black)
    #   V: 0-100  (low brightness = black)
    # For WHITE line:
    #   H: 0-180 (any hue works for white)
    #   S: 0-50   (low saturation = white/gray)
    #   V: 200-255 (high brightness = white)
    line_color: 'black'  # 'white' or 'black'
    h_lower: 0
    h_upper: 180
    s_lower: 0
    s_upper: 255      # 255 for black, 50 for white
    v_lower: 0        # 0 for black, 200 for white
    v_upper: 100      # 100 for black, 255 for white
    
    # Region of interest: detect line in the lower portion of the image
    # Values 0.0-1.0 represent fraction of image height
    roi_start_fraction: 0.4   # Start detection at 40% down the image
    roi_end_fraction: 1.0     # End at 100% (bottom edge)
    
    # PID controller gains
    # kp: proportional gain - higher = more aggressive steering
    # ki: integral gain - eliminates steady-state error (start LOW, increase gradually)
    # kd: derivative gain - improves stability and reduces overshoot
    kp: 0.8
    ki: 0.02           # Start LOW and increase gradually if needed (0.01 -> 0.05)
    kd: 0.15
    
    # Velocity parameters
    v_base: 0.25      # Base linear velocity in m/s
    w_max: 0.8        # Maximum angular velocity in rad/s (clipping)
    
    # Control loop frequency (timer period in seconds)
    # ~30 Hz = 0.033 s, ~10 Hz = 0.1 s
    control_loop_rate: 0.033
    
    # Enable/disable the line follower (useful for testing)
    enable_line_follower: true